<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Hexnest">
  <title>Hexnest</title>
  <defs>
    <linearGradient id="dnSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C232D"/>
      <stop offset="0.55" stop-color="#12171E"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="dnGlow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#35D8A4" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#35D8A4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#35D8A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dnMint" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#5BF0BF"/>
      <stop offset="0.55" stop-color="#35D8A4"/>
      <stop offset="1" stop-color="#22B98A"/>
    </linearGradient>
    <linearGradient id="dnChip" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#6BF3CA"/>
      <stop offset="1" stop-color="#2AC694"/>
    </linearGradient>
  </defs>

  <!-- container -->
  <rect x="6" y="6" width="244" height="244" rx="56" ry="56" fill="url(#dnSurface)"/>
  <circle cx="128" cy="118" r="102" fill="url(#dnGlow)"/>
  <rect x="7" y="7" width="242" height="242" rx="55" ry="55" fill="none" stroke="#2A323D" stroke-width="2"/>

  <!-- chip pins -->
  <g fill="url(#dnMint)">
    <rect x="105" y="46" width="14" height="20" rx="5"/>
    <rect x="137" y="46" width="14" height="20" rx="5"/>
    <rect x="105" y="190" width="14" height="20" rx="5"/>
    <rect x="137" y="190" width="14" height="20" rx="5"/>
  </g>

  <!-- nest cell -->
  <path d="M196 128 L162 186.89 L94 186.89 L60 128 L94 69.11 L162 69.11 Z"
        fill="none" stroke="url(#dnMint)" stroke-width="15" stroke-linejoin="round"/>

  <!-- chip body -->
  <rect x="99" y="99" width="58" height="58" rx="14" ry="14" fill="url(#dnChip)"/>
  <rect x="116" y="116" width="24" height="24" rx="6" ry="6" fill="#0B1F19"/>
</svg>
