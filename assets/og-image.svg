<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" width="1280" height="1280"
     role="img" aria-label="Hexnest — free, open-source system utility for Windows and macOS">
  <title>Hexnest</title>

  <!--
    The 1280x640 card, used two ways: as og:image and twitter:image for the website,
    and as the repository's social preview on GitHub. One asset, so the two can never
    disagree with each other.

    It is drawn into the middle of a 1280x1280 canvas because of two qlmanage quirks
    that build/make-og-image.sh works around: qlmanage scales a non-square SVG to fit
    a square thumbnail and clips the overflow, and sips crops from the centre.
    Rendering a square and taking the middle 1280x640 back out sidesteps both.

    qlmanage also composites onto an opaque white page, which is harmless here because
    the card covers every pixel - that is why the transparent application icon needs
    build/make-mac-icon.py instead.

    build/make-og-image.ps1 draws the same card with GDI+ for anyone regenerating it
    on Windows. The two are kept in step by hand; this file is the reference.
  -->

  <defs>
    <linearGradient id="ogBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A22"/>
      <stop offset="0.5" stop-color="#0F141A"/>
      <stop offset="1" stop-color="#090C10"/>
    </linearGradient>

    <radialGradient id="ogGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35D8A4" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#35D8A4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#35D8A4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ogMint" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#5BF0BF"/>
      <stop offset="0.55" stop-color="#35D8A4"/>
      <stop offset="1" stop-color="#22B98A"/>
    </linearGradient>

    <linearGradient id="ogChip" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#6BF3CA"/>
      <stop offset="1" stop-color="#2AC694"/>
    </linearGradient>

    <linearGradient id="ogPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C232D"/>
      <stop offset="0.55" stop-color="#12171E"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </linearGradient>

    <!-- One flat-top hexagon on its own origin, reused by the lattice below. -->
    <path id="ogHex" d="M62,0 L31,53.7 L-31,53.7 L-62,0 L-31,-53.7 L31,-53.7 Z"/>

    <clipPath id="ogCard">
      <rect x="0" y="0" width="1280" height="640"/>
    </clipPath>
  </defs>

  <rect width="1280" height="1280" fill="#090C10"/>

  <g transform="translate(0,320)">
    <g clip-path="url(#ogCard)">
      <rect width="1280" height="640" fill="url(#ogBack)"/>

      <circle cx="250" cy="320" r="420" fill="url(#ogGlow)"/>

      <!--
        Concentric rings centred on the icon: depth on the left half without an image,
        faded out before they reach the wordmark.
      -->
      <g fill="none" stroke="#35D8A4">
        <circle cx="250" cy="320" r="150" stroke-opacity="0.10"/>
        <circle cx="250" cy="320" r="210" stroke-opacity="0.075"/>
        <circle cx="250" cy="320" r="272" stroke-opacity="0.055"/>
        <circle cx="250" cy="320" r="336" stroke-opacity="0.038"/>
        <circle cx="250" cy="320" r="402" stroke-opacity="0.025"/>
        <circle cx="250" cy="320" r="470" stroke-opacity="0.015"/>
      </g>

      <!--
        A honeycomb bleeding off the top-right corner: the nest, diagonally opposite
        the mark that is one cell of it.
      -->
      <g fill="none" stroke="#35D8A4" stroke-opacity="0.16" stroke-width="2">
        <use href="#ogHex" x="1082" y="-14"/>
        <use href="#ogHex" x="1082" y="93"/>
        <use href="#ogHex" x="1082" y="200"/>
        <use href="#ogHex" x="1175" y="-68"/>
        <use href="#ogHex" x="1175" y="39"/>
        <use href="#ogHex" x="1175" y="146"/>
        <use href="#ogHex" x="1175" y="253"/>
        <use href="#ogHex" x="1268" y="-14"/>
        <use href="#ogHex" x="1268" y="93"/>
        <use href="#ogHex" x="1268" y="200"/>
      </g>

      <!-- One cell lit, so the lattice reads as deliberate rather than as texture. -->
      <use href="#ogHex" x="1175" y="146" fill="#35D8A4" fill-opacity="0.07"
           stroke="#35D8A4" stroke-opacity="0.34" stroke-width="2"/>
    </g>

    <!-- ============================================================ THE ICON -->
    <!-- The rounded plate the macOS application icon uses, at 208 pt. -->
    <rect x="146" y="216" width="208" height="208" rx="47" ry="47" fill="url(#ogPlate)"/>
    <rect x="147" y="217" width="206" height="206" rx="46" ry="46"
          fill="none" stroke="#2A323D" stroke-width="2"/>

    <!-- The mark, from the 256pt logo grid: translate(178,248) then scale 144/256. -->
    <g transform="translate(178,248) scale(0.5625)">
      <g fill="url(#ogMint)">
        <rect x="105" y="46" width="14" height="20" rx="5"/>
        <rect x="137" y="46" width="14" height="20" rx="5"/>
        <rect x="105" y="190" width="14" height="20" rx="5"/>
        <rect x="137" y="190" width="14" height="20" rx="5"/>
      </g>
      <path d="M196 128 L162 186.89 L94 186.89 L60 128 L94 69.11 L162 69.11 Z"
            fill="none" stroke="url(#ogMint)" stroke-width="15" stroke-linejoin="round"/>
      <rect x="99" y="99" width="58" height="58" rx="14" ry="14" fill="url(#ogChip)"/>
      <rect x="116" y="116" width="24" height="24" rx="6" ry="6" fill="#0B1F19"/>
    </g>

    <!-- ============================================================== COPY -->
    <text x="146" y="118" font-family="Helvetica Neue, Helvetica, Inter, Arial, sans-serif"
          font-size="25" font-weight="400" letter-spacing="0.2"
          fill="#7C8B9B">github.com/ahmetcaglayan/Hexnest</text>

    <text x="410" y="290" font-family="Helvetica Neue, Helvetica, Inter, Arial, sans-serif"
          font-size="104" font-weight="700" letter-spacing="-2.5"
          fill="#E8EDF4">Hex<tspan fill="#35D8A4">nest</tspan></text>

    <text x="414" y="344" font-family="Helvetica Neue, Helvetica, Inter, Arial, sans-serif"
          font-size="31" font-weight="400"
          fill="#C2CEDA">Free, open-source system utility</text>

    <text x="414" y="390" font-family="Helvetica Neue, Helvetica, Inter, Arial, sans-serif"
          font-size="25" font-weight="400"
          fill="#8B99A8">System &amp; network monitor · Start-up manager · Clean-up · Drivers</text>

    <!-- ============================================================= PILLS -->
    <g font-family="Helvetica Neue, Helvetica, Inter, Arial, sans-serif" font-size="21"
       font-weight="400" fill="#9FB0C0">
      <!-- Widths are sized to the text at 21px; the first one is the longest. -->
      <rect x="146" y="500" width="344" height="52" rx="26" fill="#151C25" stroke="#28313C"/>
      <text x="318" y="533" text-anchor="middle">Windows 10 / 11 · macOS 12+</text>

      <rect x="506" y="500" width="272" height="52" rx="26" fill="#151C25" stroke="#28313C"/>
      <text x="642" y="533" text-anchor="middle">No runtime to install</text>

      <rect x="794" y="500" width="290" height="52" rx="26" fill="#151C25" stroke="#28313C"/>
      <text x="939" y="533" text-anchor="middle">MIT licensed, no adware</text>
    </g>
  </g>
</svg>
