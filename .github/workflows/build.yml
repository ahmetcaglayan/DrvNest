name: build

# Two jobs, because Hexnest ships two applications.
#
# The Windows half is WPF and Hexnest.Core's net8.0-windows target calls SetupAPI,
# CfgMgr32 and the Windows Update Agent, so it can only be built on Windows. Nothing
# beyond the .NET 8 SDK is needed there - there are no NuGet packages and the COM
# interop is hand-written, so no tlbimp and no Visual Studio.
#
# The macOS half is Avalonia over Hexnest.Core's portable net8.0 target, and its .app
# bundle needs a Mac: iconutil builds the .icns and codesign signs the result.
#
# A third job then downloads what the other two uploaded. That exists because the
# artifact hand-off is otherwise only exercised by release.yml, which runs on a tag -
# so an upload/download action pair that stopped working together would be discovered
# at the worst possible moment, after both builds had already succeeded.
#
# A fourth job runs the three structural checkers. Ten language packs, ten README
# translations and ten website pages have to stay the same document in ten languages,
# and that is not something a reviewer can see in a diff of a language they do not
# read: a dropped table row or a missing {0} looks like ordinary translated text.
# The checkers do not need a build, so they run first and fail fast.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Check the translations and the documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the language packs against English
        run: python3 build/check-languages.py

      - name: Check the translated READMEs against README.md
        run: python3 build/check-readme.py

      - name: Check the localised site pages against the English page
        run: python3 build/check-site.py

  windows:
    name: Build and smoke-publish for Windows
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Report the SDK version
        shell: pwsh
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore src/Hexnest.sln

      - name: Build (Release)
        shell: pwsh
        run: dotnet build src/Hexnest.sln --configuration Release --no-restore

      # The real deliverable is a self-contained single file, and single-file
      # publishing fails in ways a plain build never notices. Proving it here keeps
      # the release workflow from being the first place we find out.
      - name: Publish smoke test (win-x64, self-contained single file)
        shell: pwsh
        run: |
          dotnet publish src/Hexnest.App/Hexnest.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=false `
            --output publish/win-x64

      - name: Verify the published executable
        shell: pwsh
        run: |
          $exe = 'publish/win-x64/Hexnest.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected $exe to exist after publish."
          }
          $item = Get-Item $exe
          $mb = [math]::Round($item.Length / 1MB, 1)
          Write-Host "Hexnest.exe -> $mb MB"
          if ($item.Length -lt 10MB) {
            throw "Hexnest.exe is only $mb MB; the .NET runtime is clearly not bundled."
          }

      - name: Upload the build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Hexnest-win-x64
          path: publish/win-x64/Hexnest.exe
          retention-days: 7
          if-no-files-found: error

  macos:
    name: Build and smoke-bundle for macOS
    runs-on: macos-14

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the portable core and the Mac application
        run: |
          dotnet build src/Hexnest.Core/Hexnest.Core.csproj -f net8.0 --configuration Release
          dotnet build src/Hexnest.Mac/Hexnest.Mac.csproj --configuration Release

      # The real deliverable is a .app bundle, and bundling fails in ways a plain
      # build never notices - a missing Info.plist key, an icon that iconutil rejects,
      # a signature the loader will not accept. Proving it here keeps the release
      # workflow from being the first place we find out.
      - name: Bundle smoke test
        run: |
          chmod +x build/make-mac-app.sh
          ./build/make-mac-app.sh --arch arm64

      - name: Verify the bundle
        run: |
          app="artifacts/mac/arm64/Hexnest.app"

          for required in \
              "$app/Contents/Info.plist" \
              "$app/Contents/MacOS/Hexnest" \
              "$app/Contents/Resources/Hexnest.icns"; do
            if [ ! -e "$required" ]; then
              echo "Missing from the bundle: $required" >&2
              exit 1
            fi
          done

          # A bundle without the runtime inside it would start on this machine and
          # nowhere else, which is exactly the failure a smoke test exists to catch.
          size_mb=$(du -sm "$app" | cut -f1)
          echo "Hexnest.app -> ${size_mb} MB"

          if [ "$size_mb" -lt 40 ]; then
            echo "Hexnest.app is only ${size_mb} MB; the .NET runtime is clearly not bundled." >&2
            exit 1
          fi

          codesign --verify --deep --strict "$app" && echo 'Signature verifies.'

      - name: Upload the build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Hexnest-osx-arm64
          path: artifacts/mac/arm64/Hexnest.app
          retention-days: 7
          if-no-files-found: error

  # ===================================================================================
  # The artifact hand-off release.yml depends on.
  #
  # Deliberately mirrors the publish job's download exactly - same pattern, same
  # merge-multiple - so that a breaking change in either artifact action shows up on
  # an ordinary push instead of halfway through a release.
  # ===================================================================================
  artifacts:
    name: Verify the artifact hand-off
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download both platforms' artifacts
        uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: Hexnest-*
          merge-multiple: true

      - name: Verify what arrived
        run: |
          echo "Downloaded tree:"
          find staging -maxdepth 3 | head -20

          # merge-multiple flattens both artifacts into one directory: the Windows
          # upload contributes Hexnest.exe, the macOS one the .app's own Contents.
          exe="staging/Hexnest.exe"
          mac="staging/Contents/MacOS/Hexnest"

          for required in "$exe" "$mac"; do
            if [ ! -f "$required" ]; then
              echo "The artifact hand-off is broken: $required did not arrive." >&2
              exit 1
            fi
          done

          # A zero-length or truncated file would mean the round trip corrupted it,
          # which is the failure mode a mere existence check would sail past.
          for required in "$exe" "$mac"; do
            size=$(stat -c%s "$required")
            echo "$(basename "$required"): $((size / 1048576)) MB"
            if [ "$size" -lt 1048576 ]; then
              echo "$required came back as only $size bytes." >&2
              exit 1
            fi
          done

          echo 'Upload and download agree; release.yml can hand artifacts between jobs.'
