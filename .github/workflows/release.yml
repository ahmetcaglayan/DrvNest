name: release

# Publishes a GitHub release whose assets are exactly what the in-app updater
# expects (see src/Hexnest.Core/AppInfo.cs and Updating/SelfUpdateService.cs):
#
#   Hexnest.exe          self-contained single file, win-x64
#   Hexnest-arm64.exe    self-contained single file, win-arm64
#   Hexnest-arm64.dmg    .app bundle in a disk image, Apple silicon
#   Hexnest-x64.dmg      .app bundle in a disk image, Intel Mac
#   checksums.txt        sha256sum format, "<hash>  <filename>"
#
# The updater refuses to install a release that has no checksums.txt, so that file
# is not optional. The Inno Setup installer is a convenience and is allowed to fail.
#
# Three jobs rather than one, because the two platforms cannot be built on the same
# runner: WPF needs Windows, and a .app bundle needs macOS to codesign and to build
# the .icns with iconutil. The third job is what turns their artifacts into a release,
# so the checksums are computed once, over the complete set, in one place.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ===================================================================================
  # The version, resolved once so both build jobs stamp the same number.
  # ===================================================================================
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      # The tag is the single source of truth for the version. It is read through an
      # environment variable rather than interpolated into the script, so a strange
      # tag name cannot turn into shell.
      - name: Resolve the version from the tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          tag="$(echo "$tag" | tr -d '[:space:]')"

          if ! echo "$tag" | grep -Eq '^[vV]?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$tag' is not a version tag. Expected something like v1.2.3." >&2
            exit 1
          fi

          version="${tag#v}"; version="${version#V}"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac

          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version prerelease=$prerelease"

  # ===================================================================================
  # Windows
  # ===================================================================================
  windows:
    name: Build for Windows
    needs: version
    runs-on: windows-latest

    # The secrets context cannot be used in a step-level `if`, so the presence of a
    # signing certificate is resolved once here into a plain string the steps can test.
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE_BASE64 != '' }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish src/Hexnest.App/Hexnest.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=false `
            --output publish/win-x64

      - name: Publish win-arm64
        shell: pwsh
        run: |
          dotnet publish src/Hexnest.App/Hexnest.App.csproj `
            --configuration Release `
            --runtime win-arm64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=false `
            --output publish/win-arm64

      - name: Assemble dist
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null

          $pairs = @(
            @{ From = 'publish/win-x64/Hexnest.exe';   To = 'dist/Hexnest.exe' },
            @{ From = 'publish/win-arm64/Hexnest.exe'; To = 'dist/Hexnest-arm64.exe' }
          )

          foreach ($pair in $pairs) {
            if (-not (Test-Path $pair.From)) { throw "Missing publish output: $($pair.From)" }
            Copy-Item -Path $pair.From -Destination $pair.To -Force
          }

          Get-ChildItem dist -File |
            ForEach-Object { "{0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # Convenience only. Chocolatey being down must never block a release, so this
      # step is deliberately non-fatal: the release simply ships without an installer.
      - name: Build the Inno Setup installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $onPath = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($onPath) { $iscc = $onPath.Source }
          }
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }

          & $iscc "/DMyAppVersion=$env:VERSION" 'build\installer\Hexnest.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE." }

          if (-not (Test-Path 'dist\Hexnest-Setup.exe')) {
            throw 'ISCC reported success but dist\Hexnest-Setup.exe is missing.'
          }
          Write-Host 'Installer built: dist\Hexnest-Setup.exe'

      # Code signing. Skipped entirely until a certificate exists, so the release keeps
      # working today and starts producing signed binaries the moment the two secrets
      # are added - no workflow edit needed.
      #
      # Without a signature Windows shows "Unknown publisher" on the UAC prompt and
      # SmartScreen warns on first run. That is not something a build can fix: it needs
      # a certificate issued to a verified identity. See docs/SIGNING.md.
      #
      # Runs before the checksums are generated, because signing changes the file.
      - name: Sign the executables
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $pfx = Join-Path $env:RUNNER_TEMP 'hexnest-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { throw 'signtool.exe was not found on the runner.' }

          foreach ($file in Get-ChildItem dist -Filter *.exe) {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $pfx /p $env:CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($file.Name)." }
          }

          Remove-Item $pfx -Force
          Write-Host 'All executables signed.'

      - name: Upload the Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # ===================================================================================
  # macOS
  #
  # Runs on an Apple silicon runner and cross-builds the Intel image from it, which
  # `dotnet publish -r osx-x64` does perfectly well. Both are published rather than
  # one universal binary: each carries its own copy of the .NET runtime, so lipo-ing
  # them together would double every user's download to save one decision on the
  # download page.
  # ===================================================================================
  macos:
    name: Build for macOS
    needs: version
    runs-on: macos-14

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Hexnest.app and the disk images
        run: |
          chmod +x build/make-mac-app.sh
          ./build/make-mac-app.sh --version "$VERSION" --dmg

      - name: Assemble dist
        run: |
          rm -rf dist && mkdir -p dist

          for arch in arm64 x64; do
            image="artifacts/mac/Hexnest-$arch.dmg"
            if [ ! -f "$image" ]; then
              echo "Missing disk image: $image" >&2
              exit 1
            fi
            cp "$image" "dist/Hexnest-$arch.dmg"
          done

          ls -lh dist

      - name: Upload the macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # ===================================================================================
  # The release itself
  # ===================================================================================
  publish:
    name: Publish the release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Download every platform's assets
        uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: dist-*
          merge-multiple: true

      - name: Collect them into dist
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          ls -lh dist

      # sha256sum layout: "<hash><two spaces><filename>". SelfUpdateService splits on
      # whitespace, but sticking to the standard format keeps `sha256sum -c` working
      # for anyone who prefers to verify from a shell. Computed here, over both
      # platforms at once, so there is exactly one checksums.txt in the release.
      - name: Generate checksums.txt
        run: |
          cd dist
          rm -f checksums.txt
          sha256sum $(ls | sort) > checksums.txt
          cat checksums.txt

      - name: Verify the release assets the updater requires
        run: |
          for required in Hexnest.exe Hexnest-arm64.exe Hexnest-arm64.dmg Hexnest-x64.dmg checksums.txt; do
            if [ ! -f "dist/$required" ]; then
              echo "Required release asset '$required' is missing. The in-app updater would break." >&2
              exit 1
            fi
          done
          echo 'All updater-required assets are present.'

      - name: Compose the release notes header
        run: |
          repo="https://github.com/${{ github.repository }}"

          cat > release-notes.md <<EOF
          ## Download

          ### Windows — [Hexnest.exe]($repo/releases/download/$RELEASE_TAG/Hexnest.exe)

          Windows 10 (1607) or newer, 64-bit. On an ARM64 device download
          [Hexnest-arm64.exe]($repo/releases/download/$RELEASE_TAG/Hexnest-arm64.exe) instead.

          **No prerequisites.** One file, nothing to install: the .NET 8 runtime and
          everything else Hexnest needs is inside the executable. No .NET install, no
          Visual C++ redistributable, no internet connection required to start it.
          Right-click and *Run as administrator* -- installing drivers needs elevation.

          ### macOS — [Hexnest-arm64.dmg]($repo/releases/download/$RELEASE_TAG/Hexnest-arm64.dmg)

          macOS 12 Monterey or newer. On an Intel Mac download
          [Hexnest-x64.dmg]($repo/releases/download/$RELEASE_TAG/Hexnest-x64.dmg) instead.

          Open the disk image and drag Hexnest into Applications. The bundle is signed
          ad-hoc but not notarised, so the first launch needs a right-click (or
          Control-click) and **Open**; macOS asks once and remembers the answer.
          Hexnest for Mac never runs as root and never asks for your password.

          The Mac build has no driver pages: macOS has no third-party driver store to
          scan, update or back up. Everything else -- the system and network monitors,
          the start-up manager and the cleaner -- is the same application.

          ### Verify your download

          \`\`\`powershell
          Get-FileHash .\\Hexnest.exe -Algorithm SHA256      # Windows
          \`\`\`

          \`\`\`bash
          shasum -a 256 Hexnest-arm64.dmg                   # macOS
          \`\`\`

          Compare the result with the matching line in
          [checksums.txt]($repo/releases/download/$RELEASE_TAG/checksums.txt). The hashes
          are lowercase there and uppercase in PowerShell's output; the comparison is not
          case sensitive.

          ---

          EOF

          if [ -f dist/Hexnest-Setup.exe ]; then
            printf '\nAn optional Windows installer, `Hexnest-Setup.exe`, is attached below.\n\n---\n' \
              >> release-notes.md
          fi

          # generate_release_notes appends straight onto this, so end on a blank line.
          printf '\n' >> release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Hexnest ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            dist/*
